# Builds the Windows installer on every push to main.
# Download it from the run's "Artifacts" section on GitHub (Actions tab).
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Runs the file-handling tests on Windows too, not only on the Mac.
      - run: npm test

      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: own-wiki-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
